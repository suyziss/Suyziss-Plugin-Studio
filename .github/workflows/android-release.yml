name: Android Release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          STORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$STORE" && -n "$STORE_PASS" && -n "$ALIAS" && -n "$KEY_PASS" ]]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      - name: Upload unsigned APK as artifact
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-studio-release-unsigned-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: steps.signing.outputs.configured == 'true'
        run: echo "Signing secrets detected. Configure the signing task in app/build.gradle.kts before publishing a signed release."
